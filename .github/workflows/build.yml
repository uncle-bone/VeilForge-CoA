name: Build VeilForge-CoA

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out VeilForge-CoA
        uses: actions/checkout@v4

      - name: Check out pinned Lumenveil renderer source
        uses: actions/checkout@v4
        with:
          repository: lumenveil/Lumenveil
          ref: 8e9a74ee2001390ec413097fa88ecff13832f391
          path: upstream/Lumenveil

      - name: Build, validate, and package x86 renderer
        shell: pwsh
        run: .\scripts\Build-VeilForge.ps1 -Version 1.3.5

      - name: Upload install-ready build
        uses: actions/upload-artifact@v4
        with:
          name: VeilForge-CoA-v1.3.5
          path: |
            dist/VeilForge-CoA-v1.3.5.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error


  publish:
    if: github.ref == 'refs/tags/v1.3.5'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download the verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: VeilForge-CoA-v1.3.5
          path: dist

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          name: VeilForge-CoA v1.3.5 - Refined Shafts and Preset Defaults
          body: |
            VeilForge-CoA v1.3.5 retains the Level 5 Lumenveil baseline across 133 graphics controls. Both "Remember what was seen" options start unchecked and are not changed by presets. Higher tiers strengthen sun and moon shafts while keeping sun scatter and glare restrained, and storms no longer reduce shafts to a faint fraction.

            Presets apply all 133 renderer-supported graphics settings, preserve unrelated configuration, and remain editable through the existing advanced controls. Use Save in Ctrl+F7 to persist preset or manual changes. The uninstaller removes VeilForge support files and Lumenveil while preserving DXVK.

            The Windows build workflow compiles the 32-bit renderer, runs the CPU-only harness and preset checks, verifies x86 PE headers and both executable-name paths in setup/uninstall, and packages the direct-extract ZIP. In-game behavior and hardware-specific FPS still require testing on Conquest Reborn.
          files: |
            dist/VeilForge-CoA-v1.3.5.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
